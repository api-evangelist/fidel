aid: fidel
name: Fidel
description: >-
  Fidel (Enigmatic Smile Ltd, trading as Fidel API) is a card-linking and
  payments-data platform that lets developers connect Visa, Mastercard and Amex
  cards to web and mobile applications through a single API. PCI-compliant
  card-capture SDKs (Web, iOS, Android, React Native) securely tokenize card
  details, and Fidel then delivers enriched, real-time transaction records to
  the integrator's servers over webhooks whenever a linked card is used at a
  participating merchant. Products include the Select Transactions API, an Offers
  / card-linked-rewards API, card enrollment SDKs, and attribution & insights.
  Founded in 2015 and headquartered in the UK, Fidel operates in the United
  States, United Kingdom, Ireland, Canada, Sweden and the UAE, and absorbs PCI
  scope on behalf of its integrators.
